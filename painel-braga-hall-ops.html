<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supra Ervas - TV Braga - Hall OPs</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ==== Paleta Braga (azul/ciano, tom TV/kiosk — igual espírito Monster/Supra, cor própria) ==== */
  --hall:#4DC3FF;      --hall-bg:#0F1E24;
  --hall2:#2BA6E0;     --hall2-bg:#0D1B21;
  --sub1:#4DC3FF;      --sub1-bg:#0F1E24;  /* P.A. Comprimidos */
  --sub2:#B57BFF;      --sub2-bg:#1E1428;  /* P.A. Solúveis */
  --sub3:#62E39B;      --sub3-bg:#0F2419;  /* P.A. Cápsulas Duras */
  --final:#8CFF6F;     --final-bg:#12241A;
  --vermelho:#FF5A5A;
  --cinza-900:#EAF3EC; --cinza-600:#A9BBB0; --cinza-400:#75897E;
  --cinza-200:#26332B; --cinza-100:#131A15;
  --preto:#0A0D0B;     --preto-2:#050705;  --painel:#111814;
  --sombra: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
  --glow-hall: 0 0 14px rgba(77,195,255,.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:var(--preto-2);color:var(--cinza-900);font-family:'Rajdhani',Roboto,Arial,sans-serif;overflow:hidden;}
h1,h2,h3,.op-num,.pilula,.rotulo{font-family:'Oswald',Arial,sans-serif;}

.tv{width:100vw;height:100vh;display:flex;flex-direction:column;padding:1.3vh 1.5vw;gap:.9vh;}

.cabecalho{display:flex;align-items:center;justify-content:space-between;padding-bottom:1.3vh;border-bottom:2px solid var(--hall);flex:none;gap:1vw;flex-wrap:wrap;}
.marca{display:flex;align-items:center;gap:1vw;}
.marca .selo{width:5.2vh;height:5.2vh;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--hall),#1E6E96 70%);display:flex;align-items:center;justify-content:center;font-size:2.6vh;box-shadow:var(--glow-hall);flex:none;}
.marca h1{font-size:2.6vh;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#fff;text-shadow:0 0 10px rgba(77,195,255,.3);}
.marca p{font-size:1.5vh;color:var(--hall);letter-spacing:.2px;margin-top:.15vh;}
.marca .dev-por{font-style:italic;font-size:1.7vh;color:var(--hall);letter-spacing:.2px;margin-top:.2vh;font-weight:600;}
.status-vivo{display:flex;align-items:center;gap:.5vw;font-size:1.4vh;color:var(--cinza-400);font-weight:600;letter-spacing:.04em;text-transform:uppercase;flex:none;}
.pulso{width:1.2vh;height:1.2vh;border-radius:50%;background:var(--final);box-shadow:0 0 8px var(--final);animation:pulso 2s infinite;}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(140,255,111,.55);}70%{box-shadow:0 0 0 1vh rgba(140,255,111,0);}100%{box-shadow:0 0 0 0 rgba(140,255,111,0);}}

.ferramentas{display:flex;align-items:center;gap:.6vw;flex:none;}
.ferr-btn{
  display:flex;align-items:center;gap:.4vw;background:var(--painel);border:2px solid var(--cinza-200);
  border-radius:2vh;padding:.5vh 1vw;cursor:pointer;color:var(--cinza-900);font-family:'Oswald',Arial,sans-serif;
  font-size:1.35vh;font-weight:700;text-transform:uppercase;letter-spacing:.3px;transition:.15s;white-space:nowrap;
}
.ferr-btn:hover{border-color:var(--hall);color:var(--hall);}
.ferr-btn.destaque{background:var(--hall);color:#0A1E28;border-color:var(--hall);}
.ferr-btn.destaque:hover{filter:brightness(1.08);color:#0A1E28;}
#arquivoInput{display:none;}
.upload-status{font-size:1.1vh;color:var(--cinza-400);max-width:18vw;}

.relogio{text-align:right;flex:none;}
.relogio .hora{font-family:'Oswald';font-size:3.1vh;font-weight:700;color:var(--cinza-900);line-height:1;font-variant-numeric:tabular-nums;}
.relogio .data{font-size:1.35vh;color:var(--cinza-400);margin-top:.2vh;text-transform:capitalize;}

/* ===== BUSCA ===== */
.busca-barra{flex:none;}
.busca-input{
  width:100%;background:var(--painel);border:2px solid var(--cinza-200);border-radius:1vh;
  padding:.7vh 1vw;color:var(--cinza-900);font-family:'Rajdhani';font-size:1.5vh;font-weight:600;
}
.busca-input:focus{outline:none;border-color:var(--hall);}

/* ===== BOARD (3 colunas — um cartão por Subgrupo) ===== */
.corpo{flex:1;display:flex;min-height:0;}
.board{flex:1;display:grid;gap:.8vw;min-height:0;grid-template-columns:repeat(3,minmax(0,1fr));}

.coluna{background:var(--cinza-100);border:1px solid var(--cinza-200);border-radius:.9vh;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:visible;position:relative;margin-top:7.6vh;}
.coluna > .lista{overflow-y:auto;border-radius:0 0 .9vh .9vh;}

.coluna-pill{
  position:absolute;top:-7.4vh;left:50%;transform:translateX(-50%);z-index:3;
  display:flex;align-items:center;gap:.4vw;padding:.5vh 1.2vw;border-radius:2.4vh;
  font-size:1.6vh;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
  border:2px solid var(--cor-pilula);color:var(--cor-pilula);background:var(--bg-pilula);
  white-space:nowrap;box-shadow:0 .3vh 1vh rgba(0,0,0,.5);
}
.coluna-pill .n{background:rgba(255,255,255,.12);border-radius:1.6vh;padding:.05vh .9vh;font-size:1.45vh;margin-left:.15vw;color:var(--cinza-900);}
.coluna-pill .sub{font-size:1vh;opacity:.75;margin-left:.3vw;font-weight:500;}

.lista{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.4vh;min-height:4vh;padding:.6vh .55vw;scrollbar-width:none;}
.lista::-webkit-scrollbar{display:none;}
.item{
  background:var(--preto);border:1px solid var(--cinza-200);border-left:3px solid var(--cor-item);border-radius:.6vh;
  padding:.5vh .6vw;display:flex;flex-direction:column;gap:.2vh;flex:none;
}
.item .linha1{display:flex;justify-content:space-between;gap:.5vw;align-items:baseline;}
.item .op{font-size:1.5vh;font-weight:700;color:var(--cor-item);white-space:nowrap;font-family:'Oswald';}
.item .data-emissao{font-size:1.05vh;color:var(--cinza-400);white-space:nowrap;}
.item .nome{font-size:1.55vh;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--cinza-900);line-height:1.25;}
.item .meta{display:flex;justify-content:space-between;font-size:1.1vh;color:var(--cinza-600);margin-top:.1vh;}
.item .meta b{color:var(--cinza-900);}
.vazio{flex:1;display:flex;align-items:center;justify-content:center;color:var(--cinza-400);font-size:1.15vh;text-align:center;padding:1vh;}

.toast{
  display:none;position:fixed;bottom:2vh;left:50%;transform:translateX(-50%);
  background:var(--hall);color:#0A1E28;font-family:'Oswald';font-weight:700;font-size:1.5vh;
  padding:1vh 2vw;border-radius:1vh;box-shadow:0 .5vh 2vh rgba(0,0,0,.5);z-index:50;
}
</style>
</head>
<body>
<div class="tv">

  <div class="cabecalho">
    <div class="marca">
      <div class="selo">💊</div>
      <div>
        <h1>TV Braga</h1>
        <p id="subtituloEtapas">Hall OPs · Sólidos (Comprimidos · Solúveis · Cápsulas Duras)</p>
        <p class="dev-por">Desenvolvido por MRS</p>
      </div>
    </div>

    <div class="ferramentas">
      <label class="ferr-btn destaque" for="arquivoInput">📤 Importar Relatório_OP_Aberto.xlsx</label>
      <input type="file" id="arquivoInput" accept=".csv,.xlsx,.xls" onchange="importarArquivo(event)">
      <span class="upload-status" id="uploadStatus"></span>
    </div>

    <div class="status-vivo"><span class="pulso"></span> Ao vivo</div>

    <div class="relogio">
      <div class="hora" id="relogioHora">--:--</div>
      <div class="data" id="relogioData">--</div>
    </div>
  </div>

  <div class="busca-barra">
    <input type="text" id="buscaInput" class="busca-input" placeholder="Digite o número da OP ou parte da descrição..." oninput="renderTudo()">
  </div>

  <div class="corpo">
    <div class="board" id="board"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════
   CONFIGURAÇÃO — TROCAR pela URL do Apps Script (Web App)
   publicado para a planilha do Braga, no mesmo padrão do
   Monster e do Supra. Ver arquivo apps-script-braga.gs.
   ══════════════════════════════════════════════════════════ */
const SHEETS_URL = 'COLE_AQUI_A_URL_DO_APPS_SCRIPT_DO_BRAGA';

/* ── Subgrupos do Hall (Braga) — 1 coluna para cada ── */
const EMPRESA_ALVO   = '1';
const SUBGRUPOS_ALVO = ['P.A. CMPRIMIDOS', 'P.A. SOLÚVEIS', 'P.A. CÁPSULAS DURAS'];
const ROTULO_SUBGRUPO = ['Comprimidos', 'Solúveis', 'Cápsulas Duras'];
const ICONE_SUBGRUPO  = ['💊', '🥤', '🧴'];
const COR_SUBGRUPO    = ['var(--sub1)', 'var(--sub2)', 'var(--sub3)'];
const COR_SUBGRUPO_BG = ['var(--sub1-bg)', 'var(--sub2-bg)', 'var(--sub3-bg)'];

let hall = [];

/* ── Utilidades ── */
function normalizar(txt){ return String(txt||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function limparTexto(v){ if(v===null||v===undefined) return ''; return String(v).trim().replace(/^"+|"+$/g,'').trim(); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function indiceDoSubgrupo(familia){
  const f = normalizar(familia);
  for(let i=0;i<SUBGRUPOS_ALVO.length;i++){ if(normalizar(SUBGRUPOS_ALVO[i])===f) return i; }
  return -1;
}

/* ── Relógio ── */
function atualizarRelogio(){
  const agora = new Date();
  document.getElementById('relogioHora').textContent = agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('relogioData').textContent = agora.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
}
atualizarRelogio();
setInterval(atualizarRelogio, 1000);

/* ── Carregar dados do backend (Google Sheets via Apps Script) ── */
async function carregarDoSheet(){
  if(!SHEETS_URL || SHEETS_URL.indexOf('COLE_AQUI') === 0){
    document.getElementById('board').innerHTML =
      '<div class="vazio">⚠️ Configure a URL do Apps Script (constante SHEETS_URL) para ligar este painel a uma planilha.<br>Por enquanto, importe o relatório para ver os dados nesta sessão.</div>';
    return;
  }
  try{
    const resp = await fetch(SHEETS_URL + '?t=' + Date.now(), { cache:'no-store' });
    const data = await resp.json();
    if(data.status === 'ok'){
      hall = data.hall || [];
      renderTudo();
    }
  } catch(e){
    console.error(e);
  }
}

async function postAcao(body){
  await fetch(SHEETS_URL, {
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
}

/* ══════════════════════════════════════════════════════════
   IMPORTAÇÃO DO Relatório_OP_Aberto.xlsx
   Filtro: Empresa = "1" e Subgrupo Produto em
   {P.A. CMPRIMIDOS, P.A. SOLÚVEIS, P.A. CÁPSULAS DURAS}
   ══════════════════════════════════════════════════════════ */
function validarColunasRelatorio(headerRow){
  const norm = headerRow.map(h=>normalizar(h));
  return ['empresa','codigo','subgrupo produto'].every(c=>norm.includes(c));
}
function extrairDoRelatorioOP(rows){
  const header = rows[0].map(h=>normalizar(h));
  const idx = n => header.indexOf(normalizar(n));
  const iSituacao=idx('situacao'), iEmpresa=idx('empresa'), iCodigo=idx('codigo'), iData=idx('data'),
        iQtde=idx('quantidade'), iCodProduto=idx('cod. produto'), iDescricao=idx('descricao'),
        iGrupoProduto=idx('grupo produto'), iSubgrupoProduto=idx('subgrupo produto');
  const vistos=new Set(), novas=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    if(!r||!r[iCodigo]) continue;
    if(iSituacao>=0 && !normalizar(r[iSituacao]).includes('nao finalizad')) continue;
    if(String(r[iEmpresa]).trim() !== EMPRESA_ALVO) continue;
    if(indiceDoSubgrupo(r[iSubgrupoProduto]) === -1) continue;
    const codigo=limparTexto(r[iCodigo]);
    if(!codigo||vistos.has(codigo)) continue;
    vistos.add(codigo);
    novas.push({
      op:codigo,
      dataEmissao:limparTexto(r[iData]),
      codProduto:String(r[iCodProduto]??'').trim(),
      descricao:limparTexto(r[iDescricao]),
      qtde:String(r[iQtde]??'').trim(),
      grupo:iGrupoProduto>=0 ? limparTexto(r[iGrupoProduto]) : '',
      familia:limparTexto(r[iSubgrupoProduto])
    });
  }
  return novas;
}
async function importarArquivo(event){
  const file=event.target.files[0];
  if(!file) return;
  const status=document.getElementById('uploadStatus');
  status.textContent='Lendo '+file.name+'...';
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array',cellDates:true});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{header:1,raw:false,dateNF:'dd/mm/yyyy'});
      if(rows.length<2){ status.textContent='⚠️ Arquivo vazio.'; return; }
      if(!validarColunasRelatorio(rows[0])){ status.textContent='⚠️ Arquivo inválido (colunas esperadas: Empresa, Codigo, Subgrupo Produto...).'; return; }
      const existentes=new Set(hall.map(o=>limparTexto(o.op)));
      const novasOps=extrairDoRelatorioOP(rows).filter(o=>o.op&&!existentes.has(o.op));
      if(novasOps.length===0){ status.textContent='Nenhuma OP nova encontrada para os filtros do Braga.'; return; }

      if(SHEETS_URL && SHEETS_URL.indexOf('COLE_AQUI') !== 0){
        status.textContent=`Enviando ${novasOps.length} OP(s)...`;
        await postAcao({ acao:'importar_hall', ops:novasOps });
        status.textContent=`✅ ${novasOps.length} OP(s) importada(s).`;
        carregarDoSheet();
      } else {
        // Sem backend configurado ainda: mostra os dados só nesta sessão do navegador.
        hall = hall.concat(novasOps);
        status.textContent=`✅ ${novasOps.length} OP(s) carregada(s) nesta sessão (configure SHEETS_URL para persistir).`;
        renderTudo();
      }
    }catch(err){ console.error(err); status.textContent='⚠️ Erro ao ler arquivo.'; }
  };
  reader.readAsArrayBuffer(file);
  event.target.value='';
}

/* ── Toast ── */
function mostrarToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  setTimeout(()=>t.style.display='none',2500);
}

/* ── Render ── */
function renderColunaSubgrupo(i, lista){
  const cor=COR_SUBGRUPO[i], bg=COR_SUBGRUPO_BG[i], icone=ICONE_SUBGRUPO[i], rotulo=ROTULO_SUBGRUPO[i];
  return `<div class="coluna">
      <div class="coluna-pill" style="--cor-pilula:${cor};--bg-pilula:${bg};">
        ${icone} ${escapeHtml(rotulo)} <span class="n">${lista.length}</span><span class="sub">Hall</span>
      </div>
      <div class="lista">
        ${lista.length ? lista.map(o => `
          <div class="item" style="--cor-item:${cor};">
            <div class="linha1"><span class="op">OP ${escapeHtml(o.op)}</span><span class="data-emissao">${escapeHtml(o.dataEmissao)}</span></div>
            <div class="nome">${escapeHtml(o.descricao || '(sem descrição)')}</div>
            <div class="meta"><span>Cód. <b>${escapeHtml(o.codProduto)}</b></span><span>Qtde <b>${escapeHtml(o.qtde)}</b></span></div>
          </div>`).join('') : `<div class="vazio">Nenhuma OP em ${escapeHtml(rotulo)}.</div>`}
      </div>
    </div>`;
}

function renderTudo(){
  const termo = normalizar(document.getElementById('buscaInput')?.value || '');
  const porSubgrupo = SUBGRUPOS_ALVO.map(() => []);
  hall.forEach(o=>{
    if(termo && !normalizar(o.op).includes(termo) && !normalizar(o.descricao).includes(termo)) return;
    const idx = indiceDoSubgrupo(o.familia);
    if(idx>=0) porSubgrupo[idx].push(o);
  });
  document.getElementById('board').innerHTML =
    SUBGRUPOS_ALVO.map((s,i)=>renderColunaSubgrupo(i, porSubgrupo[i])).join('');
}

/* ── Início ── */
renderTudo();
carregarDoSheet();
setInterval(carregarDoSheet, 30000);
</script>
</body>
</html>
