<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Braga — Fluxo de Produção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F2;
    --surface:#FFFFFF;
    --surface-sunk:#E4E9EA;
    --ink:#1B2733;
    --ink-soft:#57636E;
    --ink-faint:#8A96A0;
    --border:#D8DEE2;
    --border-strong:#B9C3C8;
    --steel:#3E5C76;
    --steel-ink:#2A4155;
    --ok:#3C8562;
    --ok-bg:#E4F1EA;
    --warn:#B8853A;
    --warn-bg:#FBF0DF;
    --danger:#C24949;
    --danger-bg:#FBE8E8;
    --radius:14px;
    --radius-sm:9px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --shadow-card:0 1px 2px rgba(27,39,51,.06), 0 1px 1px rgba(27,39,51,.04);
    --shadow-modal:0 24px 60px rgba(20,28,36,.28);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  h1,h2,h3{ font-family:var(--font-display); margin:0; letter-spacing:-0.01em; }
  button{ font-family:var(--font-body); }
  :focus-visible{ outline:3px solid var(--steel); outline-offset:2px; border-radius:6px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  /* ===== Estrutura geral ===== */
  .app{ max-width:1180px; margin:0 auto; padding:0 16px 48px; }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg); padding:16px 0 10px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    border-bottom:1px solid var(--border);
  }
  .topbar-title{ display:flex; align-items:center; gap:10px; }
  .topbar-dot{ width:11px; height:11px; border-radius:50%; background:var(--steel); flex:none; }
  .topbar-title h1{ font-size:clamp(19px,4vw,24px); }
  .topbar-title .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .clock{ font-variant-numeric:tabular-nums; font-size:13.5px; color:var(--ink-soft); text-align:right; line-height:1.25; }
  .btn-refresh{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--border-strong);
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--steel-ink); flex:none;
  }
  .btn-refresh:active{ transform:scale(.92); }
  .btn-refresh svg{ width:18px; height:18px; }
  .btn-refresh.girando svg{ animation:girar .7s linear; }
  @keyframes girar{ to{ transform:rotate(360deg); } }

  /* ===== Abas ===== */
  .tabs{
    display:flex; gap:6px; margin:14px 0 18px;
    background:var(--surface-sunk); padding:5px; border-radius:12px;
  }
  .tab{
    flex:1; border:none; background:transparent; color:var(--ink-soft);
    font-weight:600; font-size:14px; padding:11px 8px; border-radius:9px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .tab .count{
    font-variant-numeric:tabular-nums; font-size:12px; font-weight:700;
    background:rgba(27,39,51,.08); color:var(--ink-soft); border-radius:20px; padding:1px 7px;
  }
  .tab.ativa{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow-card); }
  .tab.ativa .count{ background:var(--steel); color:#fff; }

  .view{ display:flex; flex-direction:column; gap:14px; }
  .view[hidden]{ display:none; }

  /* ===== Cabeçalho de seção ===== */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px; }
  .section-head h2{ font-size:16px; }
  .section-head .hint{ font-size:12.5px; color:var(--ink-faint); }

  /* ===== Cartões de OP (grid) ===== */
  .grid-cards{
    display:grid; grid-template-columns:1fr; gap:10px;
  }
  @media (min-width:640px){ .grid-cards{ grid-template-columns:repeat(2,1fr); } }
  @media (min-width:980px){ .grid-cards{ grid-template-columns:repeat(3,1fr); } }

  .op-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; box-shadow:var(--shadow-card); cursor:pointer;
    display:flex; flex-direction:column; gap:8px; text-align:left;
    width:100%;
  }
  .op-card:active{ transform:scale(.99); }
  .op-card-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .op-numero{ font-family:var(--font-display); font-weight:700; font-size:15.5px; }
  .op-badge{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;
    white-space:nowrap; flex:none;
  }
  .op-desc{ font-size:13.5px; color:var(--ink); line-height:1.35; }
  .op-meta{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--ink-soft); }
  .op-meta span b{ color:var(--ink); font-weight:600; }
  .op-card-footer{
    margin-top:2px; font-size:12.5px; font-weight:600; color:var(--steel-ink);
    display:flex; align-items:center; gap:5px;
  }

  .vazio{
    background:var(--surface); border:1px dashed var(--border-strong); border-radius:var(--radius);
    padding:28px 18px; text-align:center; color:var(--ink-faint); font-size:13.5px;
  }
  .vazio strong{ display:block; color:var(--ink-soft); font-size:14.5px; margin-bottom:3px; font-weight:600; }

  /* ===== Barra de fluxo (pipeline) — elemento assinatura ===== */
  .fluxo-wrap{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 14px 12px; box-shadow:var(--shadow-card); overflow-x:auto;
  }
  .fluxo-trilho{
    display:flex; align-items:stretch; min-width:640px; position:relative;
  }
  .fluxo-no{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:4px 6px; cursor:pointer; border:none; background:transparent; position:relative;
  }
  .fluxo-no::before{
    content:''; position:absolute; top:15px; left:-50%; width:100%; height:2px;
    background:var(--border-strong); z-index:0;
  }
  .fluxo-no:first-child::before{ display:none; }
  .fluxo-marcador{
    width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:13px; color:#fff;
    position:relative; z-index:1; border:3px solid var(--surface);
  }
  .fluxo-label{ font-size:11.5px; font-weight:600; color:var(--ink-soft); text-align:center; line-height:1.2; max-width:88px; }
  .fluxo-count{ font-size:15px; font-weight:700; font-family:var(--font-display); }
  .fluxo-no.selecionado .fluxo-label{ color:var(--ink); }
  .fluxo-no.selecionado .fluxo-marcador{ box-shadow:0 0 0 3px var(--surface), 0 0 0 5px currentColor; }
  .fluxo-no.selecionado::after{
    content:''; position:absolute; bottom:-13px; left:50%; transform:translateX(-50%);
    width:8px; height:8px; background:var(--surface); border-left:1px solid var(--border); border-top:1px solid var(--border);
    rotate:45deg;
  }

  /* ===== Lista simples (finalizadas) ===== */
  .lista-final{ display:flex; flex-direction:column; gap:8px; }
  .final-item{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:11px 13px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:var(--shadow-card);
  }
  .final-item .esq{ min-width:0; }
  .final-item .op-numero{ font-size:14px; }
  .final-item .desc{ font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .final-item .dir{ text-align:right; flex:none; font-size:12px; color:var(--ink-soft); }
  .final-item .dir b{ display:block; color:var(--ok); font-family:var(--font-display); font-size:14px; }

  /* ===== Modal / bottom sheet ===== */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,28,36,.42); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal{
    background:var(--surface); width:100%; max-width:560px;
    border-radius:20px 20px 0 0; max-height:92dvh; overflow-y:auto;
    box-shadow:var(--shadow-modal); padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  }
  @media (min-width:700px){
    .modal-overlay{ align-items:center; }
    .modal{ border-radius:18px; max-height:88dvh; }
  }
  .modal-handle{ width:38px; height:4px; background:var(--border-strong); border-radius:4px; margin:0 auto 14px; }
  @media (min-width:700px){ .modal-handle{ display:none; } }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .modal-head h2{ font-size:18px; }
  .modal-head .op-badge{ margin-top:2px; }
  .modal-close{
    width:32px; height:32px; border-radius:50%; border:none; background:var(--surface-sunk);
    color:var(--ink-soft); cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center;
  }
  .modal-sub{ font-size:13px; color:var(--ink-soft); margin:2px 0 16px; line-height:1.4; }
  .modal-sub.aviso{ color:var(--warn); font-weight:600; }

  .campo{ margin-bottom:13px; }
  .campo label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  .campo input[type=text], .campo input[type=number], .campo input[type=time], .campo textarea, .campo select{
    width:100%; border:1.5px solid var(--border-strong); border-radius:10px; padding:10px 12px;
    font-size:14.5px; font-family:var(--font-body); color:var(--ink); background:var(--surface);
  }
  .campo textarea{ resize:vertical; min-height:56px; }
  .campo input.campo-calculado{
    background:var(--surface-sunk); color:var(--ink-soft); font-weight:600;
    border-style:dashed; cursor:default;
  }
  .linha2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .linha3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  @media (max-width:420px){ .linha3{ grid-template-columns:1fr 1fr; } }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1.5px solid var(--border-strong); background:var(--surface); color:var(--ink);
    padding:9px 14px; border-radius:20px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .chip.selecionado{ background:var(--steel); border-color:var(--steel); color:#fff; }
  .chip.desabilitado{ opacity:.4; pointer-events:none; }

  .etapa-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  @media (min-width:520px){ .etapa-grid{ grid-template-columns:1fr 1fr 1fr; } }
  .etapa-opcao{
    border:1.5px solid var(--border-strong); background:var(--surface); border-radius:12px;
    padding:12px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:7px;
    text-align:center;
  }
  .etapa-opcao .marcador{ width:26px; height:26px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:11.5px; }
  .etapa-opcao span{ font-size:12px; font-weight:600; line-height:1.2; }
  .etapa-opcao.selecionada{ border-color:var(--steel); background:#EEF3F7; }

  details.avancado{ margin:14px 0 6px; border-top:1px solid var(--border); padding-top:12px; }
  details.avancado summary{
    cursor:pointer; font-size:13px; font-weight:600; color:var(--steel-ink); list-style:none;
    display:flex; align-items:center; gap:6px;
  }
  details.avancado summary::-webkit-details-marker{ display:none; }
  details.avancado summary::before{ content:'▸'; transition:transform .15s; display:inline-block; }
  details.avancado[open] summary::before{ transform:rotate(90deg); }

  .modal-acoes{ display:flex; gap:10px; margin-top:18px; }
  .btn{
    flex:1; border:none; border-radius:12px; padding:13px 16px; font-size:14.5px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primario{ background:var(--steel); color:#fff; }
  .btn-secundario{ background:var(--surface-sunk); color:var(--ink); }
  .btn-perigo{ background:var(--danger-bg); color:var(--danger); }
  .btn-sucesso{ background:var(--ok-bg); color:var(--ok); }
  .btn[disabled]{ opacity:.55; pointer-events:none; }

  .acao-lista{ display:flex; flex-direction:column; gap:9px; }
  .acao-item{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    border:1.5px solid var(--border); background:var(--surface); border-radius:12px;
    padding:13px 14px; cursor:pointer; font-size:14px; font-weight:600; color:var(--ink);
  }
  .acao-item .ic{
    width:34px; height:34px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .acao-item small{ display:block; font-weight:400; font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .acao-item.perigo .ic{ background:var(--danger-bg); }
  .acao-item.sucesso .ic{ background:var(--ok-bg); }
  .acao-item.neutro .ic{ background:var(--surface-sunk); }
  .acao-item.destaque .ic{ background:#EEF3F7; }

  /* ===== Toast ===== */
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:12px 18px; border-radius:12px;
    font-size:13.5px; font-weight:600; z-index:200; max-width:90vw; text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .toast.erro{ background:var(--danger); }
  .toast.sucesso{ background:var(--ok); }
  .toast[hidden]{ display:none; }

  .skeleton{ background:linear-gradient(90deg,var(--surface-sunk) 25%,#EFF2F3 37%,var(--surface-sunk) 63%); background-size:400% 100%; animation:pulso 1.4s ease infinite; border-radius:var(--radius); height:92px; }
  @keyframes pulso{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="topbar-title">
      <span class="topbar-dot" id="statusDot"></span>
      <div>
        <h1>Braga</h1>
        <div class="sub">Fluxo de Produção — Sólidos</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="clock">
        <div id="relogioHora">--:--</div>
        <div id="relogioData">—</div>
      </div>
      <button class="btn-refresh" id="btnRefresh" title="Atualizar agora" aria-label="Atualizar agora">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </div>
  </div>

  <nav class="tabs">
    <button class="tab ativa" data-tab="hall">📥 Hall <span class="count" id="tabCountHall">0</span></button>
    <button class="tab" data-tab="producao">⚙️ Em Produção <span class="count" id="tabCountProducao">0</span></button>
    <button class="tab" data-tab="finalizadas">✅ Hoje <span class="count" id="tabCountFinalizadas">0</span></button>
  </nav>

  <!-- HALL -->
  <section class="view" id="viewHall">
    <div class="section-head">
      <h2>OPs aguardando início</h2>
      <span class="hint">Toque numa OP para escolher a etapa e iniciar</span>
    </div>
    <div class="grid-cards" id="gridHall"></div>
  </section>

  <!-- EM PRODUÇÃO -->
  <section class="view" id="viewProducao" hidden>
    <div class="fluxo-wrap">
      <div class="fluxo-trilho" id="fluxoTrilho"></div>
    </div>
    <div class="section-head">
      <h2 id="tituloEtapaSelecionada">Todas as etapas</h2>
      <span class="hint">Toque numa OP para registrar, trocar de etapa ou finalizar</span>
    </div>
    <div class="grid-cards" id="gridProducao"></div>
  </section>

  <!-- FINALIZADAS -->
  <section class="view" id="viewFinalizadas" hidden>
    <div class="section-head">
      <h2>Finalizadas hoje</h2>
      <span class="hint">OPs que concluíram todo o fluxo</span>
    </div>
    <div class="lista-final" id="listaFinalizadas"></div>
  </section>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
/* ═══════════════════ Config ═══════════════════ */
const SHEETS_URL_BRAGA = 'https://script.google.com/macros/s/AKfycbyT6HxRMu7gQvpPfgjB25-HxkSTbcqH5vugLMSSX3iEPWPC6G6MTeMFiynQleZW9U-f/exec';
const ETAPAS_PADRAO = ['Encapsulamento','Blistagem','Envase de Sachês','Envase de Cápsulas e Comprimidos','Rotulagem','Embalagem'];
const CORES_ETAPA = ['#3E5C76','#6E8B3D','#B8853A','#8B5FA3','#4E9A9A','#B5563C'];
const TURNOS = ['1º Turno','2º Turno','3º Turno','Adm'];
const UNIDADES = ['UN','KG','CX','G','L','ML','PCT'];

let dadosAtuais = { hall:[], emProducao:[], finalizadas:[], etapasGrupos: ETAPAS_PADRAO.map(e=>[e]) };
let etapasAtivas = ETAPAS_PADRAO;
let etapaFiltro = null;    // null = todas
let modalAberto = false;
let carregando = false;

/* ═══════════════════ Relógio ═══════════════════ */
function atualizarRelogio(){
  const agora = new Date();
  document.getElementById('relogioHora').textContent = agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('relogioData').textContent = agora.toLocaleDateString('pt-BR',{weekday:'short', day:'numeric', month:'short'});
}
atualizarRelogio();
setInterval(atualizarRelogio, 1000);

/* ═══════════════════ Helpers ═══════════════════ */
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function corEtapa(etapa){
  const idx = etapasAtivas.indexOf(etapa);
  return CORES_ETAPA[idx >= 0 ? idx % CORES_ETAPA.length : 0];
}
function iniciaisEtapa(etapa){
  return String(etapa||'').split(' ').filter(w=>w.length>2 || /^[A-ZÀ-Ú]/.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '·';
}
function mostrarToast(msg, tipo){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (tipo ? ' ' + tipo : '');
  el.hidden = false;
  clearTimeout(mostrarToast._t);
  mostrarToast._t = setTimeout(()=>{ el.hidden = true; }, 3600);
}
function horaAgora(){
  return new Date().toTimeString().slice(0,5);
}
function dataHojeBR(){
  return new Date().toLocaleDateString('pt-BR');
}

/* ═══════════════════ Fetch dados ═══════════════════ */
async function carregarDados(manual){
  if(modalAberto) return;
  if(carregando) return;
  carregando = true;
  const btn = document.getElementById('btnRefresh');
  if(manual) btn.classList.add('girando');
  document.getElementById('statusDot').style.background = '#B8853A';
  try{
    const resp = await fetch(SHEETS_URL_BRAGA + '?t=' + Date.now(), { cache:'no-store' });
    const data = await resp.json();
    if(data.status !== 'ok') throw new Error(data.mensagem || 'Resposta inválida');
    dadosAtuais = data;
    etapasAtivas = (data.etapasGrupos && data.etapasGrupos.length) ? data.etapasGrupos.map(g=>g[0]) : ETAPAS_PADRAO;
    document.getElementById('statusDot').style.background = '#3C8562';
    renderTudo();
  }catch(e){
    console.error(e);
    document.getElementById('statusDot').style.background = '#C24949';
    if(manual) mostrarToast('Não foi possível atualizar. Verifique a conexão.', 'erro');
  }finally{
    carregando = false;
    setTimeout(()=> btn.classList.remove('girando'), 400);
  }
}

/* ═══════════════════ Ações (POST) ═══════════════════ */
async function enviarAcao(body){
  const resp = await fetch(SHEETS_URL_BRAGA, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // evita preflight CORS no Apps Script
    body: JSON.stringify(body)
  });
  const data = await resp.json();
  if(data.status !== 'ok') throw new Error(data.mensagem || 'Ação não foi concluída');
  return data;
}

/* ═══════════════════ Abas ═══════════════════ */
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('ativa'));
    btn.classList.add('ativa');
    const alvo = btn.dataset.tab;
    document.getElementById('viewHall').hidden = alvo !== 'hall';
    document.getElementById('viewProducao').hidden = alvo !== 'producao';
    document.getElementById('viewFinalizadas').hidden = alvo !== 'finalizadas';
  });
});

/* ═══════════════════ Render geral ═══════════════════ */
function renderTudo(){
  document.getElementById('tabCountHall').textContent = dadosAtuais.hall.length;
  document.getElementById('tabCountProducao').textContent = dadosAtuais.emProducao.length;
  document.getElementById('tabCountFinalizadas').textContent = dadosAtuais.finalizadas.length;
  renderHall();
  renderFluxo();
  renderProducao();
  renderFinalizadas();
}

/* ── Hall ── */
function renderHall(){
  const grid = document.getElementById('gridHall');
  if(!dadosAtuais.hall.length){
    grid.innerHTML = '<div class="vazio" style="grid-column:1/-1"><strong>Hall vazio</strong>Nenhuma OP aguardando início no momento.</div>';
    return;
  }
  grid.innerHTML = dadosAtuais.hall.map(o => `
    <button class="op-card" data-op="${escapeHtml(o.op)}" data-origem="hall">
      <div class="op-card-top">
        <span class="op-numero">OP ${escapeHtml(o.op)}</span>
        <span class="op-badge" style="background:var(--surface-sunk); color:var(--ink-soft);">${escapeHtml(o.dataEmissao||'')}</span>
      </div>
      <div class="op-desc">${escapeHtml(o.descricao || '(sem descrição)')}</div>
      <div class="op-meta">
        <span>Cód. <b>${escapeHtml(o.codProduto||'—')}</b></span>
        <span>Qtde <b>${escapeHtml(o.qtde||'—')}</b></span>
        <span>${escapeHtml(o.familia||o.grupo||'')}</span>
      </div>
      <div class="op-card-footer">▶ Iniciar produção</div>
    </button>
  `).join('');
  grid.querySelectorAll('.op-card').forEach(card=>{
    card.addEventListener('click', ()=> abrirModalIniciar(card.dataset.op));
  });
}

/* ── Barra de fluxo ── */
function renderFluxo(){
  const trilho = document.getElementById('fluxoTrilho');
  const contagem = {};
  etapasAtivas.forEach(et => contagem[et] = 0);
  dadosAtuais.emProducao.forEach(o => { if(contagem[o.etapa] !== undefined) contagem[o.etapa]++; });

  trilho.innerHTML = etapasAtivas.map((et,i) => `
    <button class="fluxo-no ${etapaFiltro===et?'selecionado':''}" data-etapa="${escapeHtml(et)}" style="color:${CORES_ETAPA[i%CORES_ETAPA.length]}">
      <span class="fluxo-marcador" style="background:${CORES_ETAPA[i%CORES_ETAPA.length]}">${contagem[et]}</span>
      <span class="fluxo-label">${escapeHtml(et)}</span>
    </button>
  `).join('');
  trilho.querySelectorAll('.fluxo-no').forEach(no=>{
    no.addEventListener('click', ()=>{
      const et = no.dataset.etapa;
      etapaFiltro = (etapaFiltro === et) ? null : et;
      renderFluxo();
      renderProducao();
    });
  });
}

/* ── Em Produção ── */
function renderProducao(){
  const grid = document.getElementById('gridProducao');
  document.getElementById('tituloEtapaSelecionada').textContent = etapaFiltro ? etapaFiltro : 'Todas as etapas';
  const lista = etapaFiltro ? dadosAtuais.emProducao.filter(o => o.etapa === etapaFiltro) : dadosAtuais.emProducao;

  if(!lista.length){
    grid.innerHTML = `<div class="vazio" style="grid-column:1/-1"><strong>Nada por aqui</strong>Nenhuma OP em ${etapaFiltro ? escapeHtml(etapaFiltro) : 'produção'} agora.</div>`;
    return;
  }
  grid.innerHTML = lista.map(o => `
    <button class="op-card" data-op="${escapeHtml(o.op)}" data-origem="producao">
      <div class="op-card-top">
        <span class="op-numero">OP ${escapeHtml(o.op)}</span>
        <span class="op-badge" style="background:${corEtapa(o.etapa)}20; color:${corEtapa(o.etapa)};">${escapeHtml(o.etapa||'—')}</span>
      </div>
      <div class="op-desc">${escapeHtml(o.descricao || '(sem descrição)')}</div>
      <div class="op-meta">
        <span>Cód. <b>${escapeHtml(o.codProduto||'—')}</b></span>
        <span>Qtde <b>${escapeHtml(o.qtde||'—')}</b></span>
        <span>Desde <b>${escapeHtml(o.inicioEtapa||'—')}</b></span>
      </div>
      <div class="op-card-footer">⚙ Ver ações</div>
    </button>
  `).join('');
  grid.querySelectorAll('.op-card').forEach(card=>{
    card.addEventListener('click', ()=> abrirModalAcoesProducao(card.dataset.op));
  });
}

/* ── Finalizadas ── */
function renderFinalizadas(){
  const lista = document.getElementById('listaFinalizadas');
  if(!dadosAtuais.finalizadas.length){
    lista.innerHTML = '<div class="vazio"><strong>Nada finalizado ainda hoje</strong>As OPs concluídas aparecem aqui.</div>';
    return;
  }
  lista.innerHTML = dadosAtuais.finalizadas.map(o => `
    <div class="final-item">
      <div class="esq">
        <div class="op-numero">OP ${escapeHtml(o.op)}</div>
        <div class="desc">${escapeHtml(o.produto || '(sem descrição)')} · ${escapeHtml(o.etapa||'')}</div>
      </div>
      <div class="dir">
        <b>${escapeHtml(o.produzido||'—')}</b>
        ${escapeHtml(o.hora_termino||'')}
      </div>
    </div>
  `).join('');
}

/* ═══════════════════ Modais ═══════════════════ */
function abrirModal(html){
  modalAberto = true;
  const box = document.getElementById('modalBox');
  box.innerHTML = '<div class="modal-handle"></div>' + html;
  document.getElementById('modalOverlay').hidden = false;
}
function fecharModal(){
  modalAberto = false;
  document.getElementById('modalOverlay').hidden = true;
  document.getElementById('modalBox').innerHTML = '';
  carregarDados(false);
}
document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'modalOverlay') fecharModal();
});

/* ── Modal: Iniciar produção (Hall → Em Produção) ── */
function abrirModalIniciar(op){
  const dadosOP = dadosAtuais.hall.find(o => String(o.op) === String(op));
  if(!dadosOP) return;
  let etapaEscolhida = null;

  const render = () => `
    <div class="modal-head">
      <div>
        <h2>OP ${escapeHtml(op)}</h2>
        <div class="modal-sub">${escapeHtml(dadosOP.descricao||'')}</div>
      </div>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-sub">Escolha a etapa em que essa OP vai começar a produção.</div>
    <div class="etapa-grid" id="etapaGrid">
      ${etapasAtivas.map((et,i)=>`
        <div class="etapa-opcao ${etapaEscolhida===et?'selecionada':''}" data-etapa="${escapeHtml(et)}">
          <span class="marcador" style="background:${CORES_ETAPA[i%CORES_ETAPA.length]}">${iniciaisEtapa(et)}</span>
          <span>${escapeHtml(et)}</span>
        </div>
      `).join('')}
    </div>
    <div class="modal-acoes">
      <button class="btn btn-secundario" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primario" id="btnConfirmarIniciar" disabled>Iniciar produção</button>
    </div>
  `;

  abrirModal(render());
  const grid = document.getElementById('etapaGrid');
  const btnConfirmar = document.getElementById('btnConfirmarIniciar');
  grid.querySelectorAll('.etapa-opcao').forEach(opc=>{
    opc.addEventListener('click', ()=>{
      grid.querySelectorAll('.etapa-opcao').forEach(o=>o.classList.remove('selecionada'));
      opc.classList.add('selecionada');
      etapaEscolhida = opc.dataset.etapa;
      btnConfirmar.disabled = false;
    });
  });
  btnConfirmar.addEventListener('click', async ()=>{
    btnConfirmar.disabled = true;
    btnConfirmar.textContent = 'Iniciando…';
    try{
      await enviarAcao({ acao:'iniciar_producao', op: op, etapa: etapaEscolhida });
      mostrarToast(`OP ${op} iniciada em ${etapaEscolhida}.`, 'sucesso');
      fecharModal();
    }catch(e){
      mostrarToast('Não foi possível iniciar a produção. Tente de novo.', 'erro');
      btnConfirmar.disabled = false;
      btnConfirmar.textContent = 'Iniciar produção';
    }
  });
}

/* ── Modal: menu de ações de uma OP em produção ── */
function abrirModalAcoesProducao(op){
  const dadosOP = dadosAtuais.emProducao.find(o => String(o.op) === String(op));
  if(!dadosOP) return;

  abrirModal(`
    <div class="modal-head">
      <div>
        <h2>OP ${escapeHtml(op)}</h2>
        <div class="modal-sub">${escapeHtml(dadosOP.descricao||'')} — etapa atual: <b>${escapeHtml(dadosOP.etapa)}</b></div>
      </div>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="acao-lista">
      <button class="acao-item destaque" onclick="abrirModalApontamento('${escapeHtml(op)}','registrar_parcial')">
        <span class="ic">📝</span>
        <span>Registrar apontamento<small>Guarda a produção do turno, a OP continua em ${escapeHtml(dadosOP.etapa)}</small></span>
      </button>
      <button class="acao-item sucesso" onclick="abrirModalApontamento('${escapeHtml(op)}','mudar_etapa')">
        <span class="ic">➡️</span>
        <span>Concluir etapa e avançar<small>Fecha ${escapeHtml(dadosOP.etapa)} e move para a próxima etapa</small></span>
      </button>
      <button class="acao-item sucesso" onclick="abrirModalApontamento('${escapeHtml(op)}','finalizar_op')">
        <span class="ic">✅</span>
        <span>Finalizar OP<small>Encerra todo o fluxo — a OP sai de produção</small></span>
      </button>
      <button class="acao-item perigo" onclick="confirmarDevolverHall('${escapeHtml(op)}')">
        <span class="ic">↩️</span>
        <span>Devolver ao Hall<small>Cancela a produção e volta a OP para aguardando</small></span>
      </button>
    </div>
  `);
}

/* ── Confirmação: devolver ao Hall ── */
function confirmarDevolverHall(op){
  abrirModal(`
    <div class="modal-head">
      <div><h2>Devolver OP ${escapeHtml(op)} ao Hall?</h2></div>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-sub aviso">Isso cancela a produção atual dessa OP. Ela volta para "aguardando início" e perde a etapa em que estava.</div>
    <div class="modal-acoes">
      <button class="btn btn-secundario" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-perigo" id="btnConfirmarDevolver">Devolver ao Hall</button>
    </div>
  `);
  document.getElementById('btnConfirmarDevolver').addEventListener('click', async (e)=>{
    e.target.disabled = true; e.target.textContent = 'Devolvendo…';
    try{
      await enviarAcao({ acao:'devolver_hall', op: op });
      mostrarToast(`OP ${op} devolvida ao Hall.`, 'sucesso');
      fecharModal();
    }catch(err){
      mostrarToast('Não foi possível devolver a OP. Tente de novo.', 'erro');
      e.target.disabled = false; e.target.textContent = 'Devolver ao Hall';
    }
  });
}

/* ── Modal: formulário de apontamento (parcial / mudar etapa / finalizar) ── */
function abrirModalApontamento(op, tipoAcao){
  const dadosOP = dadosAtuais.emProducao.find(o => String(o.op) === String(op));
  if(!dadosOP) return;

  const titulos = {
    registrar_parcial: 'Registrar apontamento',
    mudar_etapa: 'Concluir etapa e avançar',
    finalizar_op: 'Finalizar OP'
  };
  const avisos = {
    registrar_parcial: `A OP continua em <b>${escapeHtml(dadosOP.etapa)}</b> depois desse registro.`,
    mudar_etapa: `Isso fecha <b>${escapeHtml(dadosOP.etapa)}</b> e move a OP para a próxima etapa escolhida abaixo.`,
    finalizar_op: `Isso encerra <b>todo o fluxo</b> dessa OP — ela sai de Em Produção e vai para Finalizadas.`
  };
  const corBotao = { registrar_parcial:'btn-primario', mudar_etapa:'btn-sucesso', finalizar_op:'btn-sucesso' }[tipoAcao];

  const outrasEtapas = etapasAtivas.filter(e => e !== dadosOP.etapa);

  abrirModal(`
    <div class="modal-head">
      <div>
        <h2>${titulos[tipoAcao]}</h2>
        <div class="modal-sub">OP ${escapeHtml(op)} — ${escapeHtml(dadosOP.descricao||'')}</div>
      </div>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-sub">${avisos[tipoAcao]}</div>

    ${tipoAcao === 'mudar_etapa' ? `
      <div class="campo">
        <label>Próxima etapa</label>
        <div class="chips" id="chipsProximaEtapa">
          ${outrasEtapas.map(et => `<button type="button" class="chip" data-etapa="${escapeHtml(et)}">${escapeHtml(et)}</button>`).join('')}
        </div>
      </div>
    ` : ''}

    <div class="campo">
      <label>Turno</label>
      <div class="chips" id="chipsTurno">
        ${TURNOS.map(t => `<button type="button" class="chip" data-turno="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('')}
      </div>
    </div>

    <div class="linha2">
      <div class="campo"><label>Operador</label><input type="text" id="campoOperador" placeholder="Nome"></div>
      <div class="campo"><label>Máquina</label><input type="text" id="campoMaquina" placeholder="Ex: Linha 2"></div>
    </div>

    <div class="linha3">
      <div class="campo"><label>Início</label><input type="time" id="campoInicio" value="${horaAgora()}"></div>
      <div class="campo"><label>Término</label><input type="time" id="campoTermino" value="${horaAgora()}"></div>
      <div class="campo"><label>Meta/h</label><input type="number" id="campoMeta" placeholder="0"></div>
    </div>

    <div class="linha2">
      <div class="campo">
        <label>Qtd. produzida</label>
        <input type="number" id="campoProduzido" placeholder="0">
      </div>
      <div class="campo">
        <label>Unidade</label>
        <input type="text" id="campoUnidProduzida" list="listaUnidades" placeholder="UN">
      </div>
    </div>
    <datalist id="listaUnidades">${UNIDADES.map(u=>`<option value="${u}">`).join('')}</datalist>

    <details class="avancado">
      <summary>Refugo, retrabalho e observações</summary>
      <div class="linha2" style="margin-top:12px;">
        <div class="campo"><label>Refugo</label><input type="number" id="campoRefugo" placeholder="0"></div>
        <div class="campo"><label>Un. refugo</label><input type="text" id="campoUnidRefugo" list="listaUnidades" placeholder="UN"></div>
      </div>
      <div class="linha2">
        <div class="campo"><label>Retrabalho</label><input type="number" id="campoRetrabalho" placeholder="0"></div>
        <div class="campo"><label>Un. retrabalho</label><input type="text" id="campoUnidRetrabalho" list="listaUnidades" placeholder="UN"></div>
      </div>
      <div class="campo"><label>Observações</label><textarea id="campoObs" placeholder="Algo a registrar sobre esse apontamento"></textarea></div>
    </details>

    <details class="avancado">
      <summary>Tempos, paradas e OEE</summary>
      <div class="linha2" style="margin-top:12px;">
        <div class="campo"><label>Tempo real (min)</label><input type="number" id="campoTempoReal" placeholder="0"></div>
        <div class="campo"><label>Tempo parado (min)</label><input type="number" id="campoTempoParada" placeholder="0"></div>
      </div>
      <div class="campo"><label>Motivo da parada</label><input type="text" id="campoMotivoParada" placeholder="Se houve parada"></div>
      <div class="linha2">
        <div class="campo"><label>Qtd. planejada</label><input type="number" id="campoQtdPlanejada" placeholder="0"></div>
        <div class="campo"><label>Perda de processo</label><input type="number" id="campoPerdaProcesso" placeholder="0"></div>
      </div>
      <div class="campo"><label>Un. perda</label><input type="text" id="campoUnidPerda" list="listaUnidades" placeholder="UN"></div>
      <div class="campo">
        <label>OEE — calculado automaticamente a partir de tempo, produção e qualidade</label>
      </div>
      <div class="linha3">
        <div class="campo"><label>Disponibilidade (%)</label><input type="number" id="campoOeeD" class="campo-calculado" readonly tabindex="-1"></div>
        <div class="campo"><label>Performance (%)</label><input type="number" id="campoOeeP" class="campo-calculado" readonly tabindex="-1"></div>
        <div class="campo"><label>Qualidade (%)</label><input type="number" id="campoOeeQ" class="campo-calculado" readonly tabindex="-1"></div>
      </div>
      <div class="campo"><label>OEE geral (%)</label><input type="number" id="campoOeeGeral" class="campo-calculado" readonly tabindex="-1"></div>
    </details>

    <div class="modal-acoes">
      <button class="btn btn-secundario" onclick="fecharModal()">Cancelar</button>
      <button class="btn ${corBotao}" id="btnConfirmarApontamento">${titulos[tipoAcao]}</button>
    </div>

  `);

  // Seleção de chips (turno / próxima etapa)
  let turnoEscolhido = null;
  document.getElementById('chipsTurno').querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.getElementById('chipsTurno').querySelectorAll('.chip').forEach(c=>c.classList.remove('selecionado'));
      chip.classList.add('selecionado');
      turnoEscolhido = chip.dataset.turno;
    });
  });
  let novaEtapaEscolhida = null;
  if(tipoAcao === 'mudar_etapa'){
    document.getElementById('chipsProximaEtapa').querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        document.getElementById('chipsProximaEtapa').querySelectorAll('.chip').forEach(c=>c.classList.remove('selecionado'));
        chip.classList.add('selecionado');
        novaEtapaEscolhida = chip.dataset.etapa;
      });
    });
  }

  // OEE calculado automaticamente — nunca digitado à mão.
  // D = Tempo Real / (Tempo Real + Tempo Parada)
  // P = Produzido / Qtd. Planejada  (se não houver planejada, usa Meta/h × horas trabalhadas)
  // Q = (Produzido − Refugo − Retrabalho) / Produzido
  // OEE = D × P × Q
  const numOEE = id => { const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? 0 : v; };
  function recalcularOEE(){
    const tempoReal = numOEE('campoTempoReal');
    const tempoParada = numOEE('campoTempoParada');
    const produzido = numOEE('campoProduzido');
    const refugo = numOEE('campoRefugo');
    const retrabalho = numOEE('campoRetrabalho');
    const meta = numOEE('campoMeta');
    const qtdPlanejada = numOEE('campoQtdPlanejada');

    let d = null, p = null, q = null;

    if(tempoReal + tempoParada > 0){
      d = (tempoReal / (tempoReal + tempoParada)) * 100;
    }
    if(qtdPlanejada > 0){
      p = (produzido / qtdPlanejada) * 100;
    }else if(meta > 0 && tempoReal > 0){
      p = (produzido / (meta * (tempoReal / 60))) * 100;
    }
    if(produzido > 0){
      q = ((produzido - refugo - retrabalho) / produzido) * 100;
    }

    const limitar = v => v===null ? null : Math.max(0, Math.min(100, v));
    d = limitar(d); p = limitar(p); q = limitar(q);
    const oee = (d!==null && p!==null && q!==null) ? (d/100)*(p/100)*(q/100)*100 : null;

    const fmt = v => v===null ? '' : (Math.round(v*10)/10).toString();
    document.getElementById('campoOeeD').value = fmt(d);
    document.getElementById('campoOeeP').value = fmt(p);
    document.getElementById('campoOeeQ').value = fmt(q);
    document.getElementById('campoOeeGeral').value = fmt(oee);
  }
  ['campoTempoReal','campoTempoParada','campoProduzido','campoRefugo','campoRetrabalho','campoMeta','campoQtdPlanejada']
    .forEach(id => document.getElementById(id).addEventListener('input', recalcularOEE));
  recalcularOEE();

  document.getElementById('btnConfirmarApontamento').addEventListener('click', async (e)=>{
    if(tipoAcao === 'mudar_etapa' && !novaEtapaEscolhida){
      mostrarToast('Escolha a próxima etapa antes de continuar.', 'erro');
      return;
    }
    const val = id => document.getElementById(id).value;
    const body = {
      acao: tipoAcao, op: op,
      data: dataHojeBR(),
      turno: turnoEscolhido || '',
      operador: val('campoOperador'),
      maquina: val('campoMaquina'),
      hora_inicio: val('campoInicio'),
      hora_termino: val('campoTermino'),
      meta_hora: val('campoMeta'),
      produzido: val('campoProduzido'),
      unid_produzida: val('campoUnidProduzida'),
      refugo: val('campoRefugo'),
      unid_refugo: val('campoUnidRefugo'),
      retrabalho: val('campoRetrabalho'),
      unid_retrabalho: val('campoUnidRetrabalho'),
      obs: val('campoObs'),
      tempo_real: val('campoTempoReal'),
      tempo_parada: val('campoTempoParada'),
      motivo_parada: val('campoMotivoParada'),
      oee_d: val('campoOeeD'), oee_p: val('campoOeeP'), oee_q: val('campoOeeQ'), oee: val('campoOeeGeral'),
      qtd_planejada: val('campoQtdPlanejada'),
      perda_processo: val('campoPerdaProcesso'),
      unid_perda: val('campoUnidPerda')
    };
    if(tipoAcao === 'mudar_etapa') body.novaEtapa = novaEtapaEscolhida;

    e.target.disabled = true; e.target.textContent = 'Enviando…';
    try{
      await enviarAcao(body);
      const msgs = {
        registrar_parcial: `Apontamento da OP ${op} registrado.`,
        mudar_etapa: `OP ${op} avançou para ${novaEtapaEscolhida}.`,
        finalizar_op: `OP ${op} finalizada.`
      };
      mostrarToast(msgs[tipoAcao], 'sucesso');
      fecharModal();
    }catch(err){
      mostrarToast('Não foi possível salvar. Confira os dados e tente de novo.', 'erro');
      e.target.disabled = false; e.target.textContent = titulos[tipoAcao];
    }
  });
}

carregarDados(false);
setInterval(()=> carregarDados(false), 20000);
document.getElementById('btnRefresh').addEventListener('click', ()=> carregarDados(true));
